name: James Strategy Revalidation Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Recover stale revalidation jobs
        env:
          APP_URL: ${{ secrets.RUANGKITA_APP_URL }}
          JAMES_AUTONOMY_CRON_SECRET: ${{ secrets.JAMES_AUTONOMY_CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          curl --fail-with-body "$APP_URL/api/ai/james-strategy-revalidation-watchdog"             -H "Authorization: Bearer $JAMES_AUTONOMY_CRON_SECRET"
