name: James Evolution CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
