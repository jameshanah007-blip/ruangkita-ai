name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      OPENROUTER_API_KEY: ci-placeholder
      GROQ_API_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
      OMANTO_VERIFICATION_CODE: ci-placeholder
      EXA_API_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Social Memory behavior tests
        run: npm run test:social-memory

      - name: Production build
        run: npm run build
